<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Organizer</title>
    <link rel="stylesheet" href="css/evo-calendar.css">
    <link rel="stylesheet" href="css/evo-calendar.orange-coral.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Additional CSS to style the footer and store link */
        footer {
            position: fixed; /* Fix the footer at the bottom of the viewport */
            bottom: 0; /* Place it at the very bottom */
            left: 0;
            width: 100%; /* Full width */
            text-align: center; /* Center the text */
            background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent background */
            padding: 10px 0; /* Add some padding */
            z-index: 1000; /* Ensure it stays above other content */
        }
        footer a {
            color: #000; /* Link color */
            text-decoration: none; /* Remove underline */
            font-weight: bold;
        }
        footer a:hover {
            text-decoration: underline; /* Add underline on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid-container">
            <div class="folders orange-corale" id="folders">
                <h3 class="text-uppercase">folders</h3>
            </div>
            <div class="to-do-list orange-corale" id="to-do-list">
                <h3 class="text-uppercase">to do list</h3>
                <input type="text" class="mt-1" id="task-input" placeholder="Add a new task...">
                <ul id="tasks">
                    <!-- To-do list items will be added here -->
                </ul>
            </div>
            <div class="calendar orange-corale" id="calendar-container">
                <div id="time"></div>
                <div id="calendar"></div>
            </div>
            <div class="apps orange-corale" id="apps">
                <h3 class="text-uppercase">apps</h3>
            </div>
        </div>
    </div>

    <!-- Footer with the store link -->
    <footer>
        <a href="https://ko-fi.com/chedexprintables/shop" target="_blank">https://ko-fi.com/chedexprintables/shop</a>
    </footer>

    <script src="js/jquery.min.js"></script>
    <script src="js/evo-calendar.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
